[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:vite]
command=npm run dev -- --port 5173 --host 0.0.0.0 --cors
directory=/workspace
autorestart=true
; Bound the retry budget so a permanently broken Vite (bad config,
; missing native dep, persistent port conflict) stops spinning the
; CPU in a tight restart loop.  60 retries × 5s startsecs = ~5 min of
; attempts; after that supervisord marks Vite FATAL and stops it,
; which in turn causes the agent's wget health-check (localhost:5173)
; to time out — the k8s readiness probe then keeps the pod Unready
; so traffic is not routed to a dead preview.
startretries=60
exitcodes=0,1,2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=1
startsecs=5

[program:agent]
; Wait for Vite to be ready before starting the agent.
; Vite pre-bundles deps on first boot (~900ms). We poll localhost:5173
; until it responds, then start the agent. Measured simultaneous peak:
; 1,121 MB out of 6,144 MB limit (5 GB headroom) — no OOM risk.
;
; Bounded wait: if Vite never comes up (bad config, missing dep, port
; bind failure), exit non-zero after VITE_WAIT_TIMEOUT seconds so
; supervisord can retry/surface the error.  Without this, the shell
; stays alive past startsecs and supervisord marks the agent healthy
; while agent_daemon.main never launches — pod looks fine, does nothing.
;
; VITE_WAIT_TIMEOUT env var (default 120s) lets ops tune this without
; rebuilding the image.  Keep it > Vite cold-start p99 (~5s observed)
; with comfortable slack.
command=sh -c 'TIMEOUT="${VITE_WAIT_TIMEOUT:-120}"; echo "Waiting for Vite (timeout=${TIMEOUT}s)..."; i=0; until nc -z 127.0.0.1 5173 2>/dev/null; do i=$((i+1)); if [ $i -ge $TIMEOUT ]; then echo "ERROR: Vite did not respond on :5173 within ${TIMEOUT}s — giving up" >&2; exit 1; fi; sleep 1; done && echo "Vite ready after ${i}s, starting agent" && exec python3 -m agent_daemon.main'
directory=/workspace
autorestart=true
startsecs=10
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=2
; Pass container environment variables to the agent
environment=PYTHONPATH="/workspace",PROJECT_ID="%(ENV_PROJECT_ID)s",OPENROUTER_API_KEY="%(ENV_OPENROUTER_API_KEY)s",RABBITMQ_HOST="%(ENV_RABBITMQ_HOST)s",RABBITMQ_PORT="%(ENV_RABBITMQ_PORT)s",RABBITMQ_USER="%(ENV_RABBITMQ_USER)s",RABBITMQ_PASSWORD="%(ENV_RABBITMQ_PASSWORD)s",AGENT_DB_HOST="%(ENV_AGENT_DB_HOST)s",AGENT_DB_PORT="%(ENV_AGENT_DB_PORT)s",AGENT_DB_USER="%(ENV_AGENT_DB_USER)s",AGENT_DB_PASSWORD="%(ENV_AGENT_DB_PASSWORD)s",AGENT_DB_NAME="%(ENV_AGENT_DB_NAME)s",DEBUG="%(ENV_DEBUG)s",LOG_LEVEL="%(ENV_LOG_LEVEL)s",OTEL_SERVICE_NAME="%(ENV_OTEL_SERVICE_NAME)s",OTEL_EXPORTER_OTLP_ENDPOINT="%(ENV_OTEL_EXPORTER_OTLP_ENDPOINT)s",OTEL_SDK_DISABLED="%(ENV_OTEL_SDK_DISABLED)s",BUILDER_ENVIRONMENT="%(ENV_BUILDER_ENVIRONMENT)s",VALIDATION_PIPELINE="%(ENV_VALIDATION_PIPELINE)s",VALIDATION_COHORT_V2_LITE_PLUS_PCT="%(ENV_VALIDATION_COHORT_V2_LITE_PLUS_PCT)s"
