<!-- ==========================================================================
     20-head-schema.html
     MedTech For Solutions — Search Atlas Website Studio paste block

     WHERE      Block A -> Global head embed, immediately after 10-head-critical.html.
                Block B -> Per-page head field, one per page.
                Block C -> Per-page head field, on the two pages with a visible FAQ.
     REPLACES   every JSON-LD block currently in the project, and the
                itemscope/itemtype microdata on <html>.

     WHAT WAS WRONG (measured across all 21 exported pages)
     -----------------------------------------------------
     * No WebSite node exists anywhere, so all 8 WebPage nodes set
       isPartOf -> #organization. WebPage.isPartOf expects a WebSite or
       CreativeWork; pointing it at an Organization is a mistyped dangling edge.
     * 13 pages have no WebPage node at all. /404/ has no JSON-LD of any kind.
     * The single shared @id #organization is declared on 18 pages with FOUR
       conflicting @type shapes: ["Organization","ProfessionalService"] on / and
       /sitemap/, ["Organization","LocalBusiness"] on /our-team/, bare
       "LocalBusiness" on /contact/, and bare "Organization" with a 3-property
       subset on all 13 Service pages. One @id must have one shape.
     * Organization carries no logo, no image and no sameAs.
     * All 13 Service pages re-inline the provider's name/url/telephone instead
       of referencing the global @id — which is what produces the type conflict.
       No Service has an @id of its own, so hub OfferCatalog entries cannot
       reference their children.
     * 12 of 21 BreadcrumbList trails omit the /services/ tier. / ships a useless
       1-item stub. /our-team/ is named "Staff" against a nav label of "Our Team";
       /terms-of-service/ is named "Terms of Service" against an h1 of
       "Terms of Use".
     * Four pages carry itemscope itemtype="https://schema.org/WebPage" on <html>
       while 17 do not — a second vocabulary applied at random. Standardise on
       JSON-LD and delete the microdata.

     RULES
     -----
     1. Block A is byte-identical on all 21 pages. That is the point: one @id,
        one shape. Never edit a copy of it on a single page.
     2. Never publish a block that still contains {{ }} tokens. It is valid JSON
        and invalid data — Google will ingest the literal braces.
     3. Emit a BreadcrumbList on every page EXCEPT / and /404/. A one-item
        "Home" trail asserts nothing.
     4. Emit Block C ONLY where the page renders a visible FAQ. Today that is /
        (six questions, already visible) and /contact/ (seven answers visible,
        markup missing). FAQPage for questions the visitor cannot see is a
        markup-content mismatch. Treat it as machine-readability, not a
        rich-result play: Google restricts FAQ rich results to authoritative
        government and health sites.
     5. Do NOT add Review or AggregateRating to MedTech's own testimonials.
        Self-serving review markup for the hosting entity is disallowed and
        ineligible for rich results. Render testimonials as <blockquote> with a
        <cite> carrying name, title and organisation.
     6. Do NOT add Person nodes for the six unbioed "specialists" on /our-team/.
        A named individual carrying a claimed clinical credential (HCLD/ELD)
        needs a verified bio, headshot and credential check first.
     ========================================================================== -->
