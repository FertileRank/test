<!-- ──────────────────────────────────────────────────────────────────────────
     1. CHARSET AND VIEWPORT

     Include these two lines ONLY if the Studio head does not already emit them.
     Duplicates are not fatal (the first declaration wins) but the encoding
     declaration must appear within the document's first 1024 bytes, and in the
     current project it does not: a 381-byte inline GTM <script> sits ahead of
     it. Deleting that script is what fixes the ordering — this block cannot,
     because a Studio head embed is injected near the END of <head>.

     One viewport spelling site-wide. The export ships three.
     ────────────────────────────────────────────────────────────────────────── -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">


<!-- ──────────────────────────────────────────────────────────────────────────
     2. ASSET CDN — CONNECTION WARM-UP

     Every font face and every image is served from media.cdn.builder.searchatlas.com.
     preconnect opens the TCP + TLS connection now; dns-prefetch is the fallback
     for browsers that ignore preconnect. crossorigin is REQUIRED on the
     preconnect, because fonts are fetched in CORS mode — without it the browser
     opens a second, uncredentialed connection and the warm-up is wasted.

     ACCEPTED RISK, documented: _headers governs this origin only. The four woff2
     faces and every CDN image sit outside our cache policy entirely. Self-hosting
     the fonts under /assets/fonts/ would bring them under the existing
     /assets/* immutable rule — that is a follow-up, not part of this work,
     because it changes asset URLs.
     ────────────────────────────────────────────────────────────────────────── -->
<link rel="preconnect" href="https://media.cdn.builder.searchatlas.com" crossorigin>
<link rel="dns-prefetch" href="https://media.cdn.builder.searchatlas.com">


<!-- ──────────────────────────────────────────────────────────────────────────
     3. FONT PRELOADS — EXACTLY TWO, AND ONLY THESE TWO

     fonts.css declares 14 @font-face blocks resolving to 4 unique woff2 files.
     The Lighthouse run's network-requests log proves the browser fetched exactly
     TWO of them: the `latin` subsets of Sora and DM Sans. Neither `latin-ext`
     file was requested — the only codepoint on the home page outside the latin
     range is U+2192 "→", which is in NEITHER range and silently falls back to a
     system font. NEVER preload the two latin-ext files.

       811e1196…woff2  Sora latin      fetchpriority=high — it paints the LCP
                                       element, which Lighthouse identifies as
                                       section.hero > div.hero-inner >
                                       div.hero-copy > h1#h1: a TEXT node, not
                                       an image.
       ca72d2bc…woff2  DM Sans latin   body copy, above the fold.

     crossorigin is mandatory on a font preload even for a same-origin font. A
     preload without it is fetched in a different mode from the CSS-triggered
     request, so the file is downloaded TWICE and the preload achieves nothing.

     ONE high-priority preload per page. The export ships two image preloads on
     the home page, neither of which is the LCP element. If a page's own
     above-the-fold content is genuinely an image, preload that image here
     INSTEAD of raising Sora to high — never both. (Caveat from the audit: the
     measured run had the image CDN unreachable, which can change which element
     wins LCP. Decide from the page's real above-the-fold content.)
     ────────────────────────────────────────────────────────────────────────── -->
<link rel="preload" as="font" type="font/woff2" fetchpriority="high" crossorigin
      href="https://media.cdn.builder.searchatlas.com/site-assets/e311c34b-e043-4493-8bbe-3b526ea53fd2/811e11966d29f3a01fcb19b087b61ac0.woff2">

     THIS BLOCK MUST NOT BE DEFERRED. Not with media=print, not with

         .mm-panel          { position:fixed; opacity:0; visibility:hidden; … }
         .mm-mobile-scrim   { display:none }
         .mm-back-to-top    { opacity:0; visibility:hidden }
         .mm-search-overlay { hidden by default }

     rules paints all three mega panels EXPANDED IN FLOW — 144 elements, 12
     service links with icons and blurbs — plus the back-to-top button, plus the
     whole mobile nav stack, before snapping them away. That is a
     multi-thousand-pixel first-paint jump.

         :root { --mm-header-h: 80px }   with a 76px override at max-width:1180px

<!-- ──────────────────────────────────────────────────────────────────────────
     5. SITE STYLESHEET — LOADED WITHOUT BLOCKING RENDER

     Everything that is not needed for first paint: the mega-panel contents,
     .mm-panel.mm-open / .mm-back-to-top.mm-visible open states, the mobile
     drawer's open state, the below-fold .mtfs-* image grids, the site-wide
     design-system layer, and the two <style> blocks the export duplicated
     byte-for-byte across 20 pages each (#mtfs-context-links 319 B and
     #mtfs-visible-related-links 1,850 B — 43,351 B site-wide of never-cached
     inline CSS, now one file cached for a year).

     >> UPDATE THE HASH after every publish. Current: site.2e0bf98e.css

     WHY `onload` IS THE ONE ACCEPTABLE INLINE HANDLER HERE
     -----------------------------------------------------
     This project bans inline on* attributes, and strips 812 of them from 406
     elements. Those were onmouseover/onmouseout/onfocus/onblur doing colour
     swaps — work CSS :hover and :focus-visible do for free, for keyboard users
     too. This `onload` is different in kind:

       * There is no CSS or markup mechanism for "a preloaded stylesheet becomes
         an applied stylesheet". `rel=preload` fetches at high priority without
         applying; something has to flip `rel` once the bytes have arrived.
       * It fires exactly once, at load, and performs no styling and no event
         handling. `this.onload=null` makes the one-shot explicit, guarding
         against the double-fire some browsers produce when `rel` is reassigned.
       * The alternative — a separate inline <script> — is strictly worse in a
         Studio paste block, because the Studio can reorder or relocate script
         blocks and the script would then run before the <link> exists.

     UNDER A STRICT CSP: `onload` needs script-src 'unsafe-inline' (nonces and
     hashes do not cover attribute handlers). If you add a strict CSP, switch to
     the media=print variant commented out below — that is what build/sync.mjs
     emits, and it needs no inline handler at all.

     The <noscript> copy is not optional. Without it a visitor with JavaScript
     disabled gets the inline critical CSS and nothing else: a readable page,
     but every open-state and below-fold rule missing.
     ────────────────────────────────────────────────────────────────────────── -->
<link rel="preload" as="style" href="/assets/site.2e0bf98e.css"
      onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="/assets/site.2e0bf98e.css"></noscript>

<!-- CSP-safe alternative — use INSTEAD OF the two lines above, not as well as.
     media="print" makes the sheet non-render-blocking; the tiny script promotes
     it to media="all" on load. No inline event-handler attribute is involved.
     This is what build/lib/html.mjs emits.

<link rel="stylesheet" href="/assets/site.2e0bf98e.css" media="print" data-mtfs-async>
<noscript><link rel="stylesheet" href="/assets/site.2e0bf98e.css"></noscript>
<script>(function(){var l=document.querySelector('link[data-mtfs-async]');if(!l)return;var f=function(){l.media='all';l.removeAttribute('data-mtfs-async')};if(l.sheet)f();else l.addEventListener('load',f,{once:true})})();</script>
-->
